name: Refresh profile analytics

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Jeyep18/Jeyep18' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Generate and validate the snapshot
        env:
          PROFILE_STATS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-profile-stats.mjs --self-check
          node scripts/update-profile-stats.mjs
      - name: Publish changed analytics
        run: |
          git add -- README.md assets/activity.svg assets/languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh profile analytics'
          git push origin HEAD:main
